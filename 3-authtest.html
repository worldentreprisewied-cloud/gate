<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE sign-in test</title>
<style>
  body{background:#060d1d;color:#cfe8ff;font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px}
  h1{font-size:20px;color:#5fd4ff;letter-spacing:1px}
  .box{border:1px solid #1d3a5f;border-radius:10px;padding:14px;margin:12px 0;background:#0a1428}
  button{display:block;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:8px;border:1px solid #2b587f;background:#102544;color:#9fdcff}
  button:active{background:#1a3a66}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#8fb8d8}
  .ok{color:#6fe3a5}.err{color:#ff7b7b}.dim{color:#5a7a99;font-size:12px}
</style>
</head>
<body>
<h1>[ GATE - SIGN-IN TEST ]</h1>
<div class="box">
  <div class="dim">CONTEXT</div>
  <pre id="ctx">...</pre>
</div>
<div class="box">
  <div class="dim">STEP 1 - GOOGLE SIGN-IN</div>
  <button id="signin" type="button">SIGN IN WITH GOOGLE</button>
  <pre id="auth">not signed in</pre>
</div>
<div class="box">
  <div class="dim">STEP 2 - READ PRIVATE TEST CELL (test!A1)</div>
  <button id="read" type="button">READ</button>
  <pre id="readout">-</pre>
</div>
<div class="box">
  <div class="dim">STEP 3 - WRITE PRIVATE TEST CELL (test!A1)</div>
  <button id="write" type="button">WRITE CURRENT TIME</button>
  <pre id="writeout">-</pre>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var CLIENT_ID = "216782808932-ushcbplikq7p1odt3g9cd4b0mq23m34v.apps.googleusercontent.com";
var SHEET_ID = "1uDaFnY_cS9ChDDUZsx7HdErnj4S4q322KyvL7YPLDk8";
var SCOPE = "https://www.googleapis.com/auth/spreadsheets";
var token = null, tokenClient = null;

document.getElementById("ctx").textContent =
  "display-mode: " + (window.matchMedia("(display-mode: standalone)").matches ? "standalone (installed app)" : "browser tab") + "\n" +
  "navigator.standalone: " + ("standalone" in navigator ? String(navigator.standalone) : "n/a") + "\n" +
  "ua: " + navigator.userAgent;

function out(id, msg, cls){ var e = document.getElementById(id); e.textContent = msg; e.className = cls || ""; }

function init(){
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: function(resp){
        if (resp.error) { out("auth", "ERROR: " + resp.error + " " + (resp.error_description||""), "err"); return; }
        token = resp.access_token;
        out("auth", "SIGNED IN - token received, expires in " + resp.expires_in + "s", "ok");
      }
    });
    out("auth", "ready - tap SIGN IN");
  } catch(e){ out("auth", "INIT ERROR: " + e.message, "err"); }
}
if (window.google && google.accounts) init(); else window.addEventListener("load", function(){ setTimeout(init, 500); });

document.getElementById("signin").onclick = function(){
  if (!tokenClient) { out("auth", "not ready yet, wait a second and retry", "err"); return; }
  tokenClient.requestAccessToken({prompt: ""});
};

document.getElementById("read").onclick = function(){
  if (!token) { out("readout", "sign in first", "err"); return; }
  out("readout", "reading...");
  fetch("https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values/test!A1", {
    headers: {Authorization: "Bearer " + token}
  }).then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(x){
      if (x.s === 200) out("readout", "READ OK: " + JSON.stringify(x.j.values || "(empty cell)"), "ok");
      else out("readout", "READ FAILED " + x.s + ": " + JSON.stringify(x.j), "err");
    })
    .catch(function(e){ out("readout", "READ ERROR: " + e.message, "err"); });
};

document.getElementById("write").onclick = function(){
  if (!token) { out("writeout", "sign in first", "err"); return; }
  var v = "gate-test " + new Date().toISOString();
  out("writeout", "writing: " + v);
  fetch("https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values/test!A1?valueInputOption=RAW", {
    method: "PUT",
    headers: {Authorization: "Bearer " + token, "Content-Type": "application/json"},
    body: JSON.stringify({range: "test!A1", majorDimension: "ROWS", values: [[v]]})
  }).then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(x){
      if (x.s === 200) out("writeout", "WRITE OK: " + JSON.stringify(x.j.updatedRange || x.j), "ok");
      else out("writeout", "WRITE FAILED " + x.s + ": " + JSON.stringify(x.j), "err");
    })
    .catch(function(e){ out("writeout", "WRITE ERROR: " + e.message, "err"); });
};
</script>
</body>
</html>
